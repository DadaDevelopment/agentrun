name: ${AGENTRUN_PROJECT}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dada
      POSTGRES_PASSWORD: dada
      POSTGRES_DB: dada
    volumes:
      - ${AGENTRUN_STATE}/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dada -d dada"]
      interval: 2s
      timeout: 3s
      retries: 30

  agent:
    image: ${AGENT_IMAGE}
    platform: linux/amd64
    entrypoint: ["/.kagent/.venv/bin/python", "/agentrun/local_agent.py"]
    env_file: ${AGENTRUN_STATE}/agent.env
    volumes:
      - ${AGENTRUN_TOOLS}/local_agent.py:/agentrun/local_agent.py:ro
      - ${AGENTRUN_STATE}/agent:/config:ro
    ports:
      - "${AGENT_PORT}:8080"
    networks:
      default:
        aliases:
          - ${AGENT_NAME}.kagent.svc.cluster.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/.kagent/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 60

  runtime:
    image: ${RUNTIME_IMAGE}
    platform: linux/amd64
    env_file: ${AGENTRUN_STATE}/runtime.env
    volumes:
      - ${AGENTRUN_REPO}:/spec:ro
    ports:
      - "${RUNTIME_PORT}:8083"
    networks:
      default:
        aliases:
          - dada-cloud-console-agent-runtime.argocd-prod.svc.cluster.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp:
    profiles: ["mcp"]
    build:
      context: ${MCP_BUILD_CONTEXT}
    env_file: ${AGENTRUN_STATE}/mcp.env
    ports:
      - "${MCP_PORT}:8000"
    networks:
      default:
        aliases:
          - ${MCP_PROD_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mcp-redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 40

  mcp-redis:
    profiles: ["mcp"]
    image: redis:7.4-alpine
