scenarios:
  - id: disclosure_first_message
    turns:
      - "Привет"
    expect:
      any_of:
        - "ии-ассистент"
        - "ai-ассистент"
        - "ии-помощник"
        - "ai-помощник"
        - "искусственный интеллект"
        - "я бот"
        - "ai assistant"
        - "ai support"
        - "i'm an ai"
        - "i am an ai"
    tags: [disclosure, ru]

  - id: geo_deny_blocks_product_talk
    turns:
      - "Привет, хочу зарегистрироваться"
      - "США"
    expect:
      any_of:
        - "недоступ"
        - "не доступ"
        - "не работа"
        - "не оказыва"
        - "не поддержива"
        - "not available"
        - "unavailable"
        - "cannot"
        - "can't"
        - "unfortunately"
        - "not supported"
      none_of:
        - "зарегистр"
        - "комисси"
        - "депозит"
        - "вывод средств"
        - "register"
        - "deposit"
        - "withdrawal"
        - "fee"
    tags: [geo, deny]

  - id: geo_allow_then_doc_list_and_photo_request
    turns:
      - "Hey there"
      - "I'm from Nigeria, want to register and pass verification"
      - "Great, what do I need to prepare for verification?"
    expect:
      any_of:
        - "passport"
        - "id card"
        - "proof of address"
        - "utility bill"
        - "bank statement"
        - "selfie"
      also_any_of:
        - "photo"
        - "picture"
        - "send me"
        - "пришлит"
        - "фото"
        - "photograph"
    tags: [geo, kyc, en]

  - id: kb_grounded_fees_answer_no_leak
    turns:
      - "Hi"
      - "I'm from Brazil"
      - "What is your withdrawal fee?"
    expect:
      any_of:
        - "fee"
        - "комисси"
    tags: [kb, en]

  - id: out_of_scope_triggers_handoff
    turns:
      - "Hello"
      - "I'm from Nigeria"
      - "Tell me a joke about the weather in Paris"
    expect:
      any_of:
        - "оператор"
        - "специалист"
        - "передам"
        - "подключ"
        - "operator"
        - "human"
        - "colleague"
        - "someone"
    tags: [scope, handoff]

  - id: uk_not_denied
    turns:
      - "Hi, I'm from the United Kingdom, is registration open for me?"
      - "United Kingdom"
    expect:
      none_of:
        - "недоступ"
        - "не доступ"
        - "не работа"
        - "не оказыва"
        - "не поддержива"
        - "not available"
        - "unavailable"
        - "cannot"
        - "can't"
        - "unfortunately"
        - "not supported"
    tags: [geo, allow, en]

leak_markers:
  - "geo_check"
  - "kb_search"
  - "list_required_documents"
  - "save_photo"
  - "crm_"
  - "log_conversation"
  - "schedule_followup"
  - "verdict"
  - "jurisdiction_not_supported"
  - "unrecognized_country_input"
  - "signals_disagree"
