[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrun"
version = "0.1.0"
description = "Run the production Dada agent chain (agent-runtime + kagent agent + MCP) on a laptop or CI box from an agent repo"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentrun = "agentrun.cli:main"

[tool.setuptools]
packages = ["agentrun"]

[tool.setuptools.package-data]
agentrun = ["compose.yaml", "local_agent.py"]
