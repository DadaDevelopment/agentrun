name: agent-eval

on:
  workflow_dispatch:
    inputs:
      label:
        description: "report series label"
        default: "nightly"
  schedule:
    - cron: "0 3 * * *"
  workflow_call:
    inputs:
      label:
        default: "pr"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AGENT_REPO: tg-agent-tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agentrun from this checkout
        run: pipx install .

      - name: Clone agent repo
        run: git clone --depth 1 "https://x-access-token:${{ secrets.AGENT_REPO_TOKEN }}@github.com/DadaDevelopment/tg-agent-tools.git"

      - name: Write agent spec
        working-directory: tg-agent-tools
        run: |
          cat > agentrun.toml <<'TOML'
          project = "agent-sandbox"
          env = "prod"
          agent = "tg-exchange-support"
          prompt = "agents/tg-exchange-support/core.md"

          [[tools]]
          url = "https://tg-agent-tools-624109.dada-tuda.ru/mcp"
          TOML
          echo '.agentrun/' >> .gitignore

      - name: Render agent env
        working-directory: tg-agent-tools
        run: |
          umask 077
          printf 'MODEL_API_KEY=%s\n' "$MODEL_API_KEY" > .agentrun.env
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

      - name: Start agent
        working-directory: tg-agent-tools
        run: |
          agentrun up
          agentrun smoke --timeout 240

      - name: Install eval deps
        working-directory: tg-agent-tools
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run eval suite with report
        working-directory: tg-agent-tools
        run: |
          python3 ../scripts/eval_report.py \
            --url http://127.0.0.1:18081/ \
            --output-dir eval-artifacts \
            --label "${{ inputs.label || 'nightly' }}" \
            --fail-below 0.1

      - name: Publish history and dashboard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git clone --depth 1 --branch eval-data https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git eval-data
          cd eval-data
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          cat ../tg-agent-tools/eval-artifacts/history.jsonl >> data/history.jsonl
          python3 ../scripts/build_dashboard.py --history data/history.jsonl --out index.html
          cp index.html ../tg-agent-tools/eval-artifacts/dashboard.html
          git add data/history.jsonl index.html
          git commit -m "eval history: $(date -u +%FT%TZ)"
          git push origin eval-data

      - name: Build dashboard from this run only
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          python3 scripts/build_dashboard.py \
            --history tg-agent-tools/eval-artifacts/history.jsonl \
            --out tg-agent-tools/eval-artifacts/dashboard.html

      - name: Comment report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('tg-agent-tools/eval-artifacts/summary.md', 'utf8');
            const marker = '<!-- agent-eval-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({ comment_id: existing.id, owner: context.repo.owner, repo: context.repo.repo, body: payload });
            } else {
              await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body: payload });
            }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            tg-agent-tools/eval-artifacts/report.json
            tg-agent-tools/eval-artifacts/summary.md
            tg-agent-tools/eval-artifacts/dashboard.html

      - name: Teardown
        if: always()
        working-directory: tg-agent-tools
        run: agentrun down || true
