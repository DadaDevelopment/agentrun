name: release

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, e.g. 0.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
          test -z "$(gofmt -l .)" || { echo "gofmt violations:"; gofmt -l .; exit 1; }

      - name: Resolve the version
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#cli-v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=cli-v${version}" >> "$GITHUB_OUTPUT"

      - name: Build every target
        run: sh release.sh "${{ steps.meta.outputs.version }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "ddc ${{ steps.meta.outputs.version }}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

      - name: Verify install.sh serves this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DDC_INSTALL_DIR="$RUNNER_TEMP/bin" DDC_RELEASE_TAG="${{ steps.meta.outputs.tag }}" \
            sh install.sh
          "$RUNNER_TEMP/bin/ddc" agent 2>&1 | head -3
          "$RUNNER_TEMP/bin/ddc" agent spec --repo . 2>&1 | head -2 || true
